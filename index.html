<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>GPR Absensi</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" defer></script>
</head>
<body>
  <div id="app-shell" class="app-shell">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand-group">
          <span class="brand-badge" aria-hidden="true">GA</span>
          <div class="brand-text">
            <div id="header-class-name" class="brand-title">GPR Absensi</div>
            <div class="brand-sub">Absensi &amp; Rekap Bulanan</div>
          </div>
        </div>

        <nav class="desktop-nav" aria-label="Navigasi Utama">
          <button type="button" class="nav-btn active" data-tab="absensi">Absensi</button>
          <button type="button" class="nav-btn" data-tab="siswa">Siswa</button>
          <button type="button" class="nav-btn" data-tab="kategori">Kategori</button>
          <button type="button" class="nav-btn" data-tab="pengaturan">Pengaturan &amp; Rekap</button>
        </nav>

        <div class="header-actions">
          <button
            id="sync-pill"
            type="button"
            class="sync-pill sync-idle"
            title="Status Sinkronisasi Google Sheets"
          >
            Tersimpan ✓
          </button>
        </div>
      </div>
    </header>

    <main id="main-content" class="main-content">
      <section id="view-absensi" class="view-section active" data-view="absensi"></section>
      <section id="view-siswa" class="view-section hidden" data-view="siswa"></section>
      <section id="view-kategori" class="view-section hidden" data-view="kategori"></section>
      <section id="view-pengaturan" class="view-section hidden" data-view="pengaturan"></section>
    </main>

    <nav class="bottom-nav" aria-label="Navigasi Seluler">
      <button type="button" class="bottom-nav-btn active" data-tab="absensi">
        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4" />
        </svg>
        <span>Absensi</span>
      </button>

      <button type="button" class="bottom-nav-btn" data-tab="siswa">
        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span>Siswa</span>
      </button>

      <button type="button" class="bottom-nav-btn" data-tab="kategori">
        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" />
          <line x1="7" y1="7" x2="7.01" y2="7" />
        </svg>
        <span>Kategori</span>
      </button>

      <button type="button" class="bottom-nav-btn" data-tab="pengaturan">
        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        <span>Atur &amp; Rekap</span>
      </button>
    </nav>
  </div>

  <div id="popover-root"></div>
  <div id="modal-root"></div>
  <div id="loading-overlay" class="loading-overlay hidden" role="status" aria-live="polite">
    <div class="loading-box">
      <div class="spinner" aria-hidden="true"></div>
      <span id="loading-text">Memuat data...</span>
    </div>
  </div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
